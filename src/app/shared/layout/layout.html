<nz-layout class="layout">
  <!-- Navbar -->
  <nz-header class="header" role="banner">
    <div class="logo">
      <a routerLink="/matches" class="logo-link">
        <img src="assets/futfem.png" alt="JogoDelas Logo" class="jogo-delas-logo"/>
        <span class="jogo-delas-title">JogoDelas</span>
      </a>
    </div>

    <nav class="nav" aria-label="Navegação Principal">
      <ul nz-menu nzTheme="light" nzMode="horizontal" class="header-nav">
        <li nz-menu-item nzMatchRouter>
          <a routerLink="/competitions">Competições</a>
        </li>
        <li nz-menu-item nzMatchRouter>
          <a routerLink="/matches">Jogos</a>
        </li>
        <li nz-menu-item nzMatchRouter>
          <a routerLink="/teams">Times</a>
        </li>
      </ul>
    </nav>

    <div class="header-actions">
      <button
        type="button"
        class="nav-toggle"
        (click)="toggleMobileNav()"
        aria-label="Abrir menu mobile"
      >
        <nz-icon [nzType]="mobileNavOpen() ? 'close' : 'menu'" nzTheme="outline" />
      </button>
    </div>
  </nz-header>

  <!-- Mobile Nav -->
  @if (mobileNavOpen()) {
    <div class="mobile-nav-overlay" (click)="closeMobileNav()"></div>
    <div class="mobile-nav">
      <ul nz-menu nzTheme="light" nzMode="vertical" (click)="closeMobileNav()" class="mobile-nav-menu">
        <li nz-menu-item nzMatchRouter><a routerLink="/competicoes">Competições</a></li>
        <li nz-menu-item nzMatchRouter><a routerLink="/jogos">Jogos</a></li>
        <li nz-menu-item nzMatchRouter><a routerLink="/times">Times</a></li>
      </ul>
    </div>
  }

  <!-- Main Content -->
  <nz-content>
    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </nz-content>

  <!-- Footer -->
  <nz-footer class="footer-wrapper" role="contentinfo">
    <div class="footer-content">
      <p>&copy; 2026 Jogo Delas. Todos os direitos reservados.</p>
      <div class="social-links">
        <a href="https://github.com/valdezhq" target="_blank" rel="noopener noreferrer">
          <nz-icon nzType="github" nzTheme="outline"></nz-icon> GitHub
        </a>
        <nz-divider nzType="vertical"></nz-divider>
        <a href="https://linkedin.com/in/luna-valdez" target="_blank" rel="noopener noreferrer">
          <nz-icon nzType="linkedin" nzTheme="outline"></nz-icon> LinkedIn
        </a>
      </div>
    </div>
  </nz-footer>
</nz-layout>
