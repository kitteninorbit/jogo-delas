<div class="matches-container">
  <div class="filter-header">
    <h2>{{ 'matches.title' | translate }}</h2>
    <nz-select
      [(ngModel)]="selectedCompetitionId"
      (ngModelChange)="filterMatches()"
      class="competition-filter">
      <nz-option nzValue="ALL" [nzLabel]="'matches.allCompetitions' | translate"></nz-option>
      <nz-option *ngFor="let comp of competitions" [nzValue]="comp.id" [nzLabel]="comp.name"></nz-option>
    </nz-select>
  </div>

  <nz-divider></nz-divider>

  <div nz-row [nzGutter]="[16, 16]" *ngIf="displayedMatches.length > 0; else noData">
    <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="8" *ngFor="let match of displayedMatches">
      <nz-card [nzTitle]="cardTitle" nzHoverable>
        <ng-template #cardTitle>
          <div class="card-header">
            <strong>{{ match.competition.name }}</strong>
            <span>{{ match.stage }}</span>
            <small>{{ match.matchDatetime | date:'dd/MM/yyyy HH:mm' }}</small>
          </div>
        </ng-template>

        <div class="match-teams">
          <div class="team">
            <img [src]="match.homeTeam.logoUrl || 'assets/fallback.png'" alt="logo" width="40" height="40">
            <p>{{ match.homeTeam.name }}</p>
          </div>
          <div class="vs">X</div>
          <div class="team">
            <img [src]="match.awayTeam.logoUrl || 'assets/fallback.png'" alt="logo" width="40" height="40">
            <p>{{ match.awayTeam.name }}</p>
          </div>
        </div>
        <p class="stadium">📍 {{ match.stadium }}</p>

        <!-- Transmissões / Broadcasts -->
        <nz-divider [nzText]="'matches.broadcasts' | translate" nzOrientation="left" *ngIf="match.broadcasts && match.broadcasts.length > 0"></nz-divider>
        <div class="broadcasts" *ngIf="match.broadcasts">
          <a *ngFor="let b of match.broadcasts" [href]="b.platformUrl" target="_blank">
            <nz-tag [nzColor]="b.isFree ? 'success' : 'processing'">
              {{ b.platformName }} {{ b.isFree ? ('matches.free' | translate) : '' }}
            </nz-tag>
          </a>
        </div>

      </nz-card>
    </div>
  </div>

  <ng-template #noData>
    <nz-empty [nzNotFoundContent]="'matches.noData' | translate"></nz-empty>
  </ng-template>
</div>
